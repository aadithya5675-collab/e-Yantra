<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="e-Yantra — internal operations platform for the Aviation & Robotics Club e-Yantra teams." />
    <title>e-Yantra</title>
    <script>
      // Single source of truth for the theme, applied before first paint to
      // avoid a flash of the wrong mode. Explicit choice wins; otherwise the
      // OS preference, with dark as the safe aerospace fallback.
      (function () {
        try {
          var saved = localStorage.getItem('arc-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (prefersLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f6fa' : '#070b14');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
