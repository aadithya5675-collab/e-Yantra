<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070e" />
    <meta name="description" content="ARC Mission Control — internal operations platform for the Aviation & Robotics Club e-Yantra teams." />
    <title>ARC Mission Control</title>
    <script>
      // ARC is dark-first (aerospace command centre). Opt into light only
      // when explicitly chosen. Applied before first paint to avoid a flash.
      (function () {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
